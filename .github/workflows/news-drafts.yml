name: Generar borradores de noticias

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-drafts
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar borradores desde GameBeeper
        run: node scripts/generate-news-drafts.mjs

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/news scripts/processed-news.json
          if git diff --cached --quiet; then
            echo "No hay borradores nuevos."
          else
            git commit -m "Añadir borradores de noticias desde GameBeeper"
            git push
          fi
