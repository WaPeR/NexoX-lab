name: Validar Noticias sin publicar
on:
  push:
    branches: [feature/noticias]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-news-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probar búsqueda y paginación
        run: node --test tests/site-search.test.mjs
      - name: Compilar la web
        run: npm run build
