backend:
  name: github
  repo: WaPeR/NexoX-lab
  branch: main
  base_url: https://nexox-lab-oauth.nexox.workers.dev
  auth_endpoint: auth
site_url: https://nexox.eu
display_url: https://nexox.eu
locale: es
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: reviews
    label: Reviews
    label_singular: Review
    folder: src/content/reviews
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Fecha, name: date, widget: datetime }
      - label: Destacar en portada
        name: featured
        widget: boolean
        default: false
        required: false
        hint: 'Opcional. Entre Reviews y Noticias marcadas se mostrará una sola: la de publicación más reciente. Los borradores no aparecen. No cambia la fecha del artículo.'
      - { label: Resumen, name: description, widget: text }
      - { label: Portada, name: image, widget: image, required: false }
      - label: Descripción de la portada
        name: imageAlt
        widget: string
        required: false
        hint: 'Opcional. Describe brevemente lo que se ve en la imagen, sin repetir palabras clave. No es un pie de foto visible. Si lo dejas vacío se usará el texto alternativo automático.'
      - label: Plataformas
        name: platforms
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - PC
          - PlayStation 5
          - PlayStation 4
          - Xbox Series X|S
          - Xbox One
          - Nintendo Switch
          - Nintendo Switch 2
          - Android
          - iOS
        hint: 'Opcional. Selecciona una o varias plataformas. En los artículos antiguos, revisa y sustituye manualmente los nombres que no coincidan con esta lista antes de guardar.'
      - { label: Género, name: genre, widget: string, required: false }
      - label: Desarrolladora
        name: developer
        widget: string
        required: false
        hint: 'Opcional. Estudio o estudios que desarrollan el juego. Aparecerá en la ficha debajo de la portada.'
      - label: Distribuidora
        name: publisher
        widget: string
        required: false
        hint: 'Opcional. Compañía o compañías que publican el juego.'
      - label: Fecha de lanzamiento del juego
        name: releaseDate
        widget: datetime
        required: false
        default: ''
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        hint: 'Opcional. Fecha pasada o futura del lanzamiento. No es la fecha de publicación del artículo. Si no conoces el día exacto, déjala vacía y utiliza el campo siguiente.'
      - label: Lanzamiento aproximado o nota
        name: releaseNote
        widget: string
        required: false
        hint: 'Opcional. Por ejemplo, Previsto para 2027, Por anunciar o Fecha correspondiente a PC. Si hay una fecha exacta, la nota aparecerá junto a ella.'
      - label: Estado del juego
        name: gameStatus
        widget: select
        required: false
        options:
          - Disponible
          - Acceso anticipado
          - Próximamente
        hint: 'Opcional. Selección manual; no cambiará automáticamente cuando pase la fecha de lanzamiento.'
      - label: Idiomas
        name: languages
        widget: string
        required: false
        hint: 'Opcional. Puedes aclarar textos y voces; por ejemplo, Español (textos), inglés (voces).'
      - label: Vídeo de YouTube
        name: youtube
        widget: string
        required: false
        hint: 'Opcional. Pega el enlace completo de YouTube o youtu.be. El vídeo aparecerá al final de la review; si dejas este campo vacío, no se mostrará. Los enlaces no reconocidos no generan reproductor.'
      - label: Enlace de compra — PC
        name: purchasePc
        widget: string
        required: false
        hint: 'Opcional. URL completa de compra para PC, comenzando por https:// o http://. Si lo dejas vacío no aparecerá este enlace.'
      - label: Enlace de compra — Xbox
        name: purchaseXbox
        widget: string
        required: false
        hint: 'Opcional. URL completa de compra para Xbox, comenzando por https:// o http://. Si lo dejas vacío no aparecerá este enlace.'
      - label: Enlace de compra — PlayStation
        name: purchasePlaystation
        widget: string
        required: false
        hint: 'Opcional. URL completa de compra para PlayStation, comenzando por https:// o http://. Si lo dejas vacío no aparecerá este enlace.'
      - label: Enlace de compra — Nintendo Switch
        name: purchaseSwitch
        widget: string
        required: false
        hint: 'Opcional. URL completa de compra para Nintendo Switch, comenzando por https:// o http://. Si lo dejas vacío no aparecerá este enlace.'
      - { label: Borrador, name: draft, widget: boolean, default: true }
      - { label: Contenido, name: body, widget: markdown }
  - name: news
    label: Noticias
    label_singular: Noticia
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    preview_path: 'noticias/{{slug}}/'
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Resumen, name: description, widget: text }
      - { label: Fecha de publicación, name: date, widget: datetime }
      - label: Destacar en portada
        name: featured
        widget: boolean
        default: false
        required: false
        hint: 'Opcional. Entre Reviews y Noticias marcadas se mostrará una sola: la de publicación más reciente. Los borradores no aparecen. No cambia la fecha del artículo.'
      - { label: Imagen de portada, name: image, widget: image, required: false }
      - { label: Texto alternativo de la imagen, name: imageAlt, widget: string, required: false }
      - label: Plataformas
        name: platforms
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - PC
          - PlayStation 5
          - PlayStation 4
          - Xbox Series X|S
          - Xbox One
          - Nintendo Switch
          - Nintendo Switch 2
          - Android
          - iOS
      - { label: Fuente, name: sourceName, widget: string, required: false }
      - label: Enlace de la fuente
        name: sourceUrl
        widget: string
        required: false
        hint: 'Opcional. Enlace completo al anuncio o información original, comenzando por https:// o http://.'
      - label: Enlace de vídeo de YouTube
        name: youtube
        widget: string
        required: false
        hint: 'Opcional. Pega el enlace de YouTube o youtu.be del teaser, tráiler o vídeo. Aparecerá después del texto. Si lo dejas vacío o no se reconoce el enlace, no se mostrará ningún reproductor.'
      - { label: Borrador, name: draft, widget: boolean, default: true }
      - { label: Cuerpo de la noticia, name: body, widget: markdown }
  - name: pages
    label: Páginas
    files:
      - name: about
        label: Sobre NexoX
        file: src/content/pages/sobre-nexox.md
        fields:
          - label: Contenido
            name: body
            widget: markdown
            hint: 'Edita aquí toda la página: presentación, títulos, enlaces y contacto. El título principal también forma parte del contenido.'
      - name: privacy
        label: Política de privacidad
        file: src/content/pages/privacidad.md
        fields:
          - label: Contenido
            name: body
            widget: markdown
            hint: 'Edita aquí toda la política de privacidad: título principal, apartados y texto. Todo forma parte del mismo contenido.'
